# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy gating: autoDeployTrigger: checksPass makes Render wait for the
# GitHub Actions check run on a commit (.github/workflows/ci.yml) to
# succeed before deploying — no build is attempted if CI hasn't passed or
# hasn't run at all. This is native Render behavior, not something wired up
# through GitHub Actions.
#
# Path splitting: each service's buildFilter.paths scopes it to its own
# directory, so a frontend-only change never triggers a backend build and
# vice versa. Because docs/** and root-level *.md changes match neither
# service's filter, docs-only commits trigger no deploy at all.
#
# Setup (manual, one-time, do this yourself in the Render dashboard):
#   1. New > Blueprint, point it at this repo.
#   2. Render creates both services below and assigns them URLs. The
#      FRONTEND_URL/BACKEND_URL/CORS_ORIGINS/VITE_API_URL values below
#      assume Render's default "<service name>.onrender.com" pattern — if
#      either service ends up on a different hostname (custom domain, name
#      collision), update these four values to match before relying on
#      cross-origin login or Meta OAuth/image fetches.
#   3. Set the real DATABASE_URL secret on sales-guru-backend (a managed
#      Postgres instance — see PRD.md §6, SQLite is dev-only). The build
#      targets prisma/postgres/schema.prisma (a Postgres-provider mirror of
#      the SQLite prisma/schema.prisma used for local dev — see that file's
#      own header comment) via --schema, since a single schema.prisma can't
#      target both providers (the migration SQL itself is dialect-specific).
#   4. No deploy hooks or GitHub secrets are needed for CI-gating; checksPass
#      reads GitHub check runs directly.
#
# PRISMA_BINARY_CACHE_DIR: prisma-client-py's default binary cache lives
# under the build user's home directory (~/.cache/prisma-python), which is
# outside the project directory Render actually ships to the running
# instance — the query engine binary `prisma generate` downloads during
# the build is then missing at runtime (BinaryNotFoundError on startup,
# confirmed against a real deploy 2026-09-02). Pointing the cache at a
# project-relative path fixes it, since that path IS part of what gets
# deployed.
#
# META_TOKEN_ENCRYPTION_KEY (sync: false, set manually in the Render
# dashboard, same as DATABASE_URL/ANTHROPIC_API_KEY/META_APP_SECRET):
# encrypts MetaConnection.accessToken at rest (app/core/crypto.py).
# Generate one with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
# ANTHROPIC_API_KEY / META_APP_ID / META_APP_SECRET / META_REDIRECT_URI
# (all sync: false): declared here as of 2026-09-19 so the Blueprint UI
# actually prompts for them — previously only referenced in this comment
# block, never declared as real envVars entries below, so a fresh
# Blueprint deploy silently left the Strategist/Creative Agents and the
# Meta OAuth connection broken (no error at deploy time, just a runtime
# "not configured" failure the first time a business tried to use them).
# META_REDIRECT_URI must match app/api/meta.py's callback_router route
# exactly (GET /meta/callback), reached through the frontend's /api rewrite
# (see "Same-site API" above) — i.e.
# https://sales-guru-frontend.onrender.com/api/meta/callback on a default
# Render hostname — and that same URL must also be added to the Meta
# app's own OAuth redirect URI allowlist (developers.facebook.com's Meta
# Login product settings), or the OAuth round-trip 400s on Meta's side
# before ever reaching this backend.

# Same-site API (2026-10-21): the frontend and backend are separate onrender.com
# subdomains, which a browser treats as different sites. iOS Safari (and Chrome and
# Firefox on iOS, which use its engine) never keeps a cookie set by a different site, so
# login worked but every later request answered 401 "Not authenticated" on iPhones. The
# frontend therefore calls /api on its own address (VITE_API_URL=/api) and this blueprint
# rewrites /api/* to the backend, which makes the session cookie first-party.
#
# This moves one thing: Meta's OAuth callback must come back through the same address so
# the session cookie arrives with it. Before (or when) this deploys:
#   1. In the Meta app's Valid OAuth Redirect URIs, add
#      https://sales-guru-frontend.onrender.com/api/meta/callback
#   2. Set META_REDIRECT_URI on sales-guru-backend to that same URL.
# Until both are done, connecting Meta ads fails; everything else is unaffected.

services:
  - type: web
    name: sales-guru-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: starter
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    buildCommand: "uv sync --locked && uv run prisma generate --schema=prisma/postgres/schema.prisma && uv run prisma migrate deploy --schema=prisma/postgres/schema.prisma"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://sales-guru-frontend.onrender.com
      - key: BACKEND_URL
        value: https://sales-guru-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://sales-guru-frontend.onrender.com
      - key: PRISMA_BINARY_CACHE_DIR
        value: .prisma-cache
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false

  - type: web
    runtime: static
    name: sales-guru-frontend
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      # Relative, so the browser only ever talks to this site: the /api/* rewrite
      # below forwards to the backend. See the "Same-site API" note at the top.
      - key: VITE_API_URL
        value: /api
    routes:
      # The API under the frontend's own address, so the session cookie the backend
      # sets is first-party. A rewrite (not a redirect) keeps the URL in the browser.
      # It must come before the catch-all below or index.html would answer /api/*.
      - type: rewrite
        source: /api/*
        destination: https://sales-guru-backend.onrender.com/*
      # App.tsx uses react-router's BrowserRouter (real History API routes,
      # not hash-based) — a static host serving files directly 404s on any
      # deep link or hard refresh (e.g. /businesses/:id) since no such file
      # exists on disk. Confirmed against a real deploy 2026-09-02. This
      # rewrite serves index.html for every path so React Router can take
      # over client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html
