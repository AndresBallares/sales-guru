name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run everything by hand (Actions tab -> CI -> Run workflow, or
  # `gh workflow run CI --ref main`): backend-ci and frontend-ci both run, whatever
  # the last change touched, so a docs-only push to main can still be checked in full.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which package(s) changed so backend/frontend jobs only run when
  # relevant, and docs-only changes run neither (mirrors the Render
  # deploy-gating split in .github/workflows/deploy.yml).
  #
  # frontend-ci also triggers on backend/** changes: its e2e suite runs
  # Playwright against BOTH a real frontend build and a real backend
  # (playwright.config.ts's webServer starts both), so it's a genuine
  # frontend+backend integration test — a backend-only change that breaks
  # that integration needs to fail this job, not slip through unchecked.
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the GitHub API to list a PR's changed files;
    # that needs pull-requests: read, which the repo's default (restrictive)
    # token permissions don't grant on their own — without this, the job
    # fails with "Resource not accessible by integration", backend-ci/
    # frontend-ci get silently skipped (never actually run), and ci-status
    # still reports green since it only fails on failure/cancelled, not
    # skipped.
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      # Nothing to compare against on a manual run, so it is skipped there.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            # Files whose change can break either side, so both suites run:
            # the API client + its types (frontend/src/lib/api.ts mirrors the
            # backend schemas), CI/hook/deploy config, and root tooling.
            shared:
              - 'frontend/src/lib/api.ts'
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'scripts/**'
              - 'Makefile'
              - 'render.yaml'
              - '.gitattributes'
              - 'package.json'
              - 'package-lock.json'
              - 'pyproject.toml'
              - 'uv.lock'

      # Prisma schemas/migrations and backend/pyproject.toml/uv.lock live under
      # backend/**, so they already count as backend changes. frontend-ci also
      # runs on every backend change (see the note above this job).
      - name: Decide which suites run, and why
        id: decide
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          SHARED: ${{ steps.filter.outputs.shared }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run_backend=false
          run_frontend=false
          reasons=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run_backend=true; run_frontend=true
            reasons+=("manual run -> backend-ci + frontend-ci, whatever changed last")
          fi
          if [ "$BACKEND" = "true" ]; then
            run_backend=true; run_frontend=true
            reasons+=("backend/** changed -> backend-ci + frontend-ci (e2e integration)")
          fi
          if [ "$FRONTEND" = "true" ]; then
            run_frontend=true
            reasons+=("frontend/** changed -> frontend-ci")
          fi
          if [ "$SHARED" = "true" ]; then
            run_backend=true; run_frontend=true
            reasons+=("shared file changed (api.ts, workflows, hooks, root config) -> backend-ci + frontend-ci")
          fi
          if [ ${#reasons[@]} -eq 0 ]; then
            reasons+=("no backend, frontend or shared files changed (docs-only) -> backend-ci and frontend-ci intentionally skipped")
          fi
          echo "backend=$run_backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$run_frontend" >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope"
            echo "- backend-ci: **$run_backend**"
            echo "- frontend-ci: **$run_frontend**"
            for r in "${reasons[@]}"; do echo "- $r"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Backstop for the local commit-msg hook (scripts/check-no-ai-coauthor.sh)
  # — catches commits pushed with --no-verify or from a machine that never
  # ran `pre-commit install`. Runs unconditionally (not path-scoped): a bad
  # trailer can ride along with any change, including docs-only ones.
  commit-message-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI co-author attribution in commit messages
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No before/after on a manual run: check the commit it runs on.
            range="-1 HEAD"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="-1 $after"
            else
              range="$before..$after"
            fi
          fi

          bad="$(git log $range --pretty=%B | grep -Ei '^co-authored-by:.*(claude|anthropic)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Commit message has a Co-authored-by trailer attributing to Claude/Anthropic."
            echo "$bad"
            exit 1
          fi

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Must run before any lint/type-check step: mypy and ty both import
      # the generated `prisma` client (it doesn't exist as real code until
      # `prisma generate` runs), so type-checking first fails on a fresh
      # checkout with "Module 'prisma' has no attribute 'Prisma'".
      - name: Generate Prisma client
        run: uv run prisma generate

      - name: Apply Prisma migrations
        run: uv run prisma migrate deploy

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Type check (ty)
        run: uv run ty check

      - name: Test (pytest, coverage >=90%)
        run: uv run pytest

  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint, incl. jsx-a11y)
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test (vitest, coverage >=90%)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # e2e's webServer config runs a real backend (uv run uvicorn ...)
      # alongside the built frontend — needs uv + backend deps + a
      # generated Prisma client before Playwright shells out to it.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies (for e2e's real backend)
        working-directory: backend
        run: uv sync --locked

      - name: Generate Prisma client (for e2e's real backend)
        working-directory: backend
        run: uv run prisma generate

      # A fresh key every run — e2e's backend only ever writes to its own
      # throwaway e2e.db (reset at the start of every run), never anything
      # that needs to survive across runs, same "no real secret sitting in
      # the repo" reasoning as conftest.py's own per-test-session key.
      # Needed now that a spec (fake-meta-publish.spec.ts) actually creates
      # a MetaConnection — no prior e2e spec got far enough to need it.
      - name: Generate a throwaway Meta token encryption key (for e2e's real backend)
        working-directory: backend
        run: echo "META_TOKEN_ENCRYPTION_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: E2E test (Playwright + axe-core a11y checks, real backend)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Single aggregate job to set as the required status check in GitHub
  # branch protection. Individual jobs above are conditional (skipped on
  # docs-only changes), and GitHub branch protection cannot reliably require
  # a job that sometimes never runs — this job always runs and fails if any
  # job that *did* run failed, so it's a stable, always-present check name.
  ci-status:
    if: always()
    needs: [changes, commit-message-check, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      COMMIT: ${{ needs.commit-message-check.result }}
      BACKEND: ${{ needs.backend-ci.result }}
      FRONTEND: ${{ needs.frontend-ci.result }}
      RUN_BACKEND: ${{ needs.changes.outputs.backend }}
      RUN_FRONTEND: ${{ needs.changes.outputs.frontend }}
    steps:
      - name: Verify every required job passed or was intentionally skipped
        run: |
          fail=0
          # expect <name> <actual> <should-run>: a job that should run must
          # have succeeded; one that should not run must be "skipped".
          # Anything else (failure, cancelled, missing/skipped-by-accident,
          # or a broken changes job) fails the gate.
          expect() {
            name="$1"; actual="$2"; should_run="$3"
            if [ "$should_run" = "true" ]; then want=success; else want=skipped; fi
            echo "$name: $actual (expected $want)"
            if [ "$actual" != "$want" ]; then
              echo "::error::$name was $actual, expected $want" >&2
              fail=1
            fi
          }
          expect changes "$CHANGES" true
          expect commit-message-check "$COMMIT" true
          expect backend-ci "$BACKEND" "${RUN_BACKEND:-true}"
          expect frontend-ci "$FRONTEND" "${RUN_FRONTEND:-true}"
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All required checks passed (or were intentionally skipped per the changes job)."
