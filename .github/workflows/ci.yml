name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which package(s) changed so backend/frontend jobs only run when
  # relevant, and docs-only changes run neither (mirrors the Render
  # deploy-gating split in .github/workflows/deploy.yml).
  #
  # frontend-ci also triggers on backend/** changes: its e2e suite runs
  # Playwright against BOTH a real frontend build and a real backend
  # (playwright.config.ts's webServer starts both), so it's a genuine
  # frontend+backend integration test — a backend-only change that breaks
  # that integration needs to fail this job, not slip through unchecked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
              - 'backend/**'

  # Backstop for the local commit-msg hook (scripts/check-no-ai-coauthor.sh)
  # — catches commits pushed with --no-verify or from a machine that never
  # ran `pre-commit install`. Runs unconditionally (not path-scoped): a bad
  # trailer can ride along with any change, including docs-only ones.
  commit-message-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI co-author attribution in commit messages
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="-1 $after"
            else
              range="$before..$after"
            fi
          fi

          bad="$(git log $range --pretty=%B | grep -Ei '^co-authored-by:.*(claude|anthropic)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Commit message has a Co-authored-by trailer attributing to Claude/Anthropic."
            echo "$bad"
            exit 1
          fi

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Must run before any lint/type-check step: mypy and ty both import
      # the generated `prisma` client (it doesn't exist as real code until
      # `prisma generate` runs), so type-checking first fails on a fresh
      # checkout with "Module 'prisma' has no attribute 'Prisma'".
      - name: Generate Prisma client
        run: uv run prisma generate

      - name: Apply Prisma migrations
        run: uv run prisma migrate deploy

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Type check (ty)
        run: uv run ty check

      - name: Test (pytest, coverage >=90%)
        run: uv run pytest

  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint, incl. jsx-a11y)
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test (vitest, coverage >=90%)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # e2e's webServer config runs a real backend (uv run uvicorn ...)
      # alongside the built frontend — needs uv + backend deps + a
      # generated Prisma client before Playwright shells out to it.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies (for e2e's real backend)
        working-directory: backend
        run: uv sync --locked

      - name: Generate Prisma client (for e2e's real backend)
        working-directory: backend
        run: uv run prisma generate

      - name: E2E test (Playwright + axe-core a11y checks, real backend)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Single aggregate job to set as the required status check in GitHub
  # branch protection. Individual jobs above are conditional (skipped on
  # docs-only changes), and GitHub branch protection cannot reliably require
  # a job that sometimes never runs — this job always runs and fails if any
  # job that *did* run failed, so it's a stable, always-present check name.
  ci-status:
    if: always()
    needs: [changes, commit-message-check, backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          commit_result="${{ needs.commit-message-check.result }}"
          backend_result="${{ needs.backend-ci.result }}"
          frontend_result="${{ needs.frontend-ci.result }}"
          echo "commit-message-check: $commit_result"
          echo "backend-ci: $backend_result"
          echo "frontend-ci: $frontend_result"
          if [[ "$commit_result" == "failure" || "$commit_result" == "cancelled" ]]; then
            echo "commit-message-check did not pass" >&2
            exit 1
          fi
          if [[ "$backend_result" == "failure" || "$backend_result" == "cancelled" ]]; then
            echo "backend-ci did not pass" >&2
            exit 1
          fi
          if [[ "$frontend_result" == "failure" || "$frontend_result" == "cancelled" ]]; then
            echo "frontend-ci did not pass" >&2
            exit 1
          fi
          echo "All required checks passed (or were correctly skipped)."
